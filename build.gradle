// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        agp_version = '9.2.1'
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.5.0'

        classpath 'com.huawei.agconnect:agcp:1.9.5.302' // Only if HMS build is required
        classpath "com.android.tools.build:gradle:$agp_version" // Only if HMS build is required
    }
}

plugins {
    id 'com.android.application' version '9.2.1' apply false
    id 'com.android.library' version '9.2.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.0' apply false
}

ext {
    compileSdkVersion = 37
    minSdkVersion = 24
    targetSdkVersion = 37

    coreKotlinVersion = "1.19.0"
    archComponentsVersion = "2.11.0"
    navigationVersion = "2.9.8"
    appcompatVersion = "1.7.1"
    materialVersion = "1.14.0"
    constraintLayoutVersion = "2.2.1"
    firebaseVersion = "24.1.2"
    pushKitVersion = "6.3.0.302"
    biometricVersion = "1.2.0-alpha05"

    junitVersion = "4.13.2"
    extJunitVersion = "1.3.0"
    mockitoCoreVersion = "5.23.0"
    mockitoKotlinVersion = "6.3.0"
    espressoCoreVersion = "3.7.0"
}
